<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>__SARLAVHA__</title>
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #dbe1ea;
    --brand: #1d6bff; --brand-ink: #ffffff; --ok: #0f9d58; --warn: #b45309; --bad: #dc2626; --field: #f8fafc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220; --card: #131c2e; --ink: #e8eefb; --muted: #94a3b8; --line: #26324a;
      --brand: #4d8dff; --brand-ink: #06122b; --ok: #34d399; --warn: #fbbf24; --bad: #f87171; --field: #0e1626;
    }
  }
  body[data-product=palantir] { --brand: #e07a1f; --brand-ink: #ffffff; }
  @media (prefers-color-scheme: dark) { body[data-product=palantir] { --brand: #ff9a3c; --brand-ink: #1c1309; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 440px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 16px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  input[type=text], input[type=password] {
    width: 100%; height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--field); color: var(--ink); font-size: 17px; outline: none;
  }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
  #code { font-family: ui-monospace, Consolas, "Roboto Mono", monospace; text-transform: uppercase; letter-spacing: 0.02em; }
  button { font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); height: 48px; padding: 0 16px; font-weight: 600; }
  button.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; width: 100%; height: 52px; font-size: 16px; }
  button.ghost { height: 38px; padding: 0 12px; font-size: 14px; color: var(--muted); }
  button:disabled { opacity: .55; cursor: default; }
  .row { display: flex; gap: 8px; }
  .row > input { flex: 1; min-width: 0; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 14px; }
  .seg button { height: 40px; border: 0; background: transparent; color: var(--muted); font-size: 14px; padding: 0 6px; }
  .seg button[aria-pressed=true] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
  .seg.big button { height: 44px; font-size: 15px; }
  .seg.big button[aria-pressed=true] { color: var(--brand); }
  .msg { font-size: 13px; margin: 8px 2px 0; min-height: 19px; }
  .msg.bad { color: var(--bad); } .msg.warn { color: var(--warn); } .msg.ok { color: var(--ok); } .msg.muted { color: var(--muted); }
  .out { margin-top: 16px; border-top: 1px dashed var(--line); padding-top: 16px; }
  .key {
    font-family: ui-monospace, Consolas, "Roboto Mono", monospace; font-size: clamp(13px, 4.5vw, 20px); font-weight: 700; letter-spacing: 0.02em;
    white-space: nowrap; overflow-x: auto; user-select: all; -webkit-user-select: all; padding: 14px 8px; border-radius: 12px;
    background: var(--field); border: 1px solid var(--line); text-align: center; min-height: 60px;
    display: flex; align-items: center; justify-content: center;
  }
  .key.long { white-space: normal; word-break: break-all; font-size: 13px; font-weight: 600; letter-spacing: 0; line-height: 1.5; text-align: left; justify-content: flex-start; }
  .key.empty { color: var(--muted); font-size: 14px; font-weight: 500; letter-spacing: 0; font-family: inherit; white-space: normal; user-select: none; -webkit-user-select: none; }
  .bar { height: 6px; border-radius: 3px; background: var(--field); overflow: hidden; margin-top: 12px; visibility: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .12s linear; }
  .bar.on { visibility: visible; }
  .note { color: var(--muted); font-size: 12.5px; margin: 14px 2px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body data-product="__BREND__">
<main>
  <header>
    <div>
      <h1>__SARLAVHA__</h1>
      <p class="sub" id="subtitle">Faqat egasi uchun</p>
    </div>
    <button class="ghost" id="lockBtn" hidden>Qulflash</button>
  </header>

  <!-- 1. Qulf -->
  <section class="card" id="lockView">
    <form id="lockForm" autocomplete="off">
      <label for="pin">Parol</label>
      <div class="row">
        <input id="pin" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
        <button type="button" id="showPin" aria-label="Parolni ko'rsatish" style="height:52px">Ko'rsat</button>
      </div>
      <div class="bar" id="bar"><i></i></div>
      <p class="msg" id="lockMsg"></p>
      <button class="primary" id="unlockBtn" type="submit">Ochish</button>
    </form>
    <p class="note">Parolsiz bu fayldan kalit chiqarib bo'lmaydi. Internet kerak emas.</p>
  </section>

  <!-- 2. Kalit -->
  <section class="card" id="mainView" hidden>
    <div class="seg big" role="group" aria-label="Dastur" id="products">
      <button type="button" data-product="denta" aria-pressed="true">DentaCRM</button>
      <button type="button" data-product="palantir" aria-pressed="false">Palantir</button>
    </div>
    <div class="seg" role="group" aria-label="Kalit turi" id="modes">
      <button type="button" data-mode="license" aria-pressed="true">Aktivatsiya</button>
      <button type="button" data-mode="recovery" aria-pressed="false">Parolni tiklash</button>
    </div>

    <label for="code" id="codeLabel">Mijozning kompyuter kodi</label>
    <div class="row">
      <input id="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <button type="button" id="pasteBtn" style="height:52px">Joylash</button>
    </div>
    <p class="msg muted" id="codeMsg"></p>

    <div class="out">
      <label id="keyLabel">Aktivatsiya kaliti</label>
      <div class="key empty" id="key">Kompyuter kodini kiriting</div>
      <p class="msg" id="copyMsg"></p>
      <button class="primary" id="copyBtn" disabled>Kalitni nusxalash</button>
    </div>
    <p class="note" id="modeNote"></p>
  </section>
</main>

<script>
/*__CRYPTO__*/
</script>
<script>
'use strict';
/* Shifrlangan maxfiy qism — scripts/kalit-sahifa.ts to'ldiradi: l, r — DentaCRM so'zlari, p — Palantir imzo kaliti. Parolsiz o'qib bo'lmaydi */
const PAYLOAD = /*__PAYLOAD__*/null;
const C = KalitCrypto;

const $ = id => document.getElementById(id);
let secrets = null;
let product = 'denta';
let mode = 'license';

const HWID_RE = /^HWID-[0-9A-F]{16}$/;
/** Bo'shliq va ko'rinmas belgilarni olib tashlaydi */
const cleanId = raw => String(raw || '').replace(/[\s​‎‏﻿]+/g, '').toUpperCase();
const has = p => p === 'denta' ? !!(secrets && secrets.l && secrets.r) : !!(secrets && secrets.p);

/** Kod qaysi dasturniki ekanini o'zi taniydi: HWID-… — DentaCRM, XXXX-XXXX-XXXX-XXXX — Palantir */
function detect(id) {
  if (/^HWID-/.test(id)) return 'denta';
  if (C.normalizeMachineId(id)) return 'palantir';
  return null;
}

function setProduct(p) {
  product = p;
  document.body.dataset.product = p;
  document.querySelectorAll('#products button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.product === p)));
  $('modes').hidden = p !== 'denta';
  if (p !== 'denta') mode = 'license';
  document.querySelectorAll('#modes button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.mode === mode)));
  $('code').placeholder = p === 'denta' ? 'HWID-XXXXXXXXXXXXXXXX' : 'XXXX-XXXX-XXXX-XXXX';
}

function showKey(text, long) {
  const k = $('key');
  k.className = 'key' + (long ? ' long' : '');
  k.textContent = text;
  $('copyBtn').disabled = false;
}
function noKey(text) {
  const k = $('key');
  k.className = 'key empty';
  k.textContent = text;
  $('copyBtn').disabled = true;
}

function render() {
  let id = cleanId($('code').value);
  const msg = $('codeMsg');
  $('copyMsg').textContent = '';
  // Boshqa dasturning kodi joylansa — o'sha dasturga o'tadi (adashib DentaCRM kalitini Palantir'ga berib qo'ymaslik uchun)
  const seen = id ? detect(id) : null;
  if (seen && seen !== product && has(seen)) setProduct(seen);
  $('keyLabel').textContent = mode === 'license' ? `${product === 'denta' ? 'DentaCRM' : 'Palantir'} aktivatsiya kaliti` : 'DentaCRM parolni tiklash kaliti';
  $('modeNote').textContent = product === 'palantir'
    ? "Klinika panelidagi «Kompyuter kodi»ni kiriting. Kalitni (PAL1-…) Telegram'da yuboring — u «Kalitni kiritish»ga qo'yiladi. Kalit faqat shu kompyuterda ishlaydi."
    : mode === 'license'
      ? 'Mijoz bu kalitni dasturning aktivatsiya oynasiga kiritadi. Kalit faqat shu kompyuterda ishlaydi.'
      : 'Admin parolini tiklash kaliti (PAROL_TIKLASH_KALITI.bat bilan bir xil). Faqat shu kompyuterda ishlaydi.';
  if (!has(product)) {
    msg.className = 'msg warn';
    msg.textContent = 'Bu sahifada bu dastur uchun maxfiy qism yo\'q — sahifani qayta yarating.';
    noKey('—');
    return;
  }
  if (!id) {
    msg.className = 'msg muted';
    msg.textContent = 'Mijoz dasturdagi «nusxalash» tugmasini bosib yuborgan kodni joylang.';
    noKey('Kompyuter kodini kiriting');
    return;
  }
  if (product === 'denta') {
    if (!HWID_RE.test(id)) {
      // Dastur ekranda ID'ni qisqartirib ko'rsatadi ("HWID-ABC...") — ekrandan ko'chirilsa kalit mos kelmaydi
      msg.className = 'msg bad';
      msg.textContent = /\.\.\.|…/.test(id) || id.length < 21
        ? "ID to'liq emas. Ekrandagi qisqartirilgan kod yaramaydi — mijoz «nusxalash» tugmasini bosib, to'liq kodni yuborsin (HWID- va 16 ta belgi)."
        : "ID formati noto'g'ri: HWID- dan keyin 16 ta belgi (0–9, A–F) bo'lishi kerak.";
      noKey('—');
      return;
    }
    msg.className = 'msg ok';
    msg.textContent = "DentaCRM kodi — to'g'ri formatda.";
    showKey(mode === 'license' ? C.dentaLicense(id, secrets.l) : C.dentaRecovery(id, secrets.r), false);
    return;
  }
  const norm = C.normalizeMachineId(id);
  if (!norm) {
    msg.className = 'msg bad';
    msg.textContent = "Kod noto'g'ri: 16 ta belgi (0–9, A–F), ko'rinishi XXXX-XXXX-XXXX-XXXX.";
    noKey('—');
    return;
  }
  msg.className = 'msg ok';
  msg.textContent = `Palantir kodi: ${norm}`;
  showKey(C.palantirLicense(C.unhex(secrets.p), norm), true);
}

function lock() {
  secrets = null;
  $('code').value = ''; $('pin').value = '';
  $('key').textContent = ''; $('lockMsg').textContent = '';
  $('mainView').hidden = true; $('lockBtn').hidden = true; $('lockView').hidden = false;
  $('subtitle').textContent = 'Faqat egasi uchun';
}

$('lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('unlockBtn'), bar = $('bar'), msg = $('lockMsg');
  if (!PAYLOAD) { msg.className = 'msg bad'; msg.textContent = 'Bu shablon fayl. Kalit sahifasini «npm run kalit-sahifa» orqali yarating.'; return; }
  btn.disabled = true; msg.textContent = ''; bar.classList.add('on');
  const fill = bar.firstElementChild; fill.style.width = '0';
  let result = null;
  try { result = await C.unlock(PAYLOAD, $('pin').value.trim(), p => { fill.style.width = Math.round(p * 100) + '%'; }); } catch (err) { result = null; }
  bar.classList.remove('on'); btn.disabled = false;
  if (!result || !((result.l && result.r) || result.p)) {
    msg.className = 'msg bad'; msg.textContent = "Parol noto'g'ri.";
    $('pin').select();
    return;
  }
  secrets = result;
  $('pin').value = '';
  $('products').hidden = !(has('denta') && has('palantir'));
  setProduct(has('denta') ? 'denta' : 'palantir');
  $('lockView').hidden = true; $('mainView').hidden = false; $('lockBtn').hidden = false;
  $('subtitle').textContent = 'Ochiq — ishni tugatgach qulflang';
  render();
  $('code').focus();
});

$('showPin').addEventListener('click', () => {
  const p = $('pin'); const show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  $('showPin').textContent = show ? 'Yashir' : "Ko'rsat";
});
$('lockBtn').addEventListener('click', lock);
$('code').addEventListener('input', render);
// Qo'lda boshqa dasturga o'tilsa — eski kod tozalanadi (u boshqa dasturniki: qoldirilsa, o'zi tanib qaytarib yuborardi)
document.querySelectorAll('#products button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.product === product) return;
  setProduct(b.dataset.product); $('code').value = ''; render(); $('code').focus();
}));
document.querySelectorAll('#modes button').forEach(b => b.addEventListener('click', () => { mode = b.dataset.mode; setProduct(product); render(); }));

// «Joylash»: bufer API'si fayl sifatida ochilganda bo'lmasligi mumkin — unda tugma yashiriladi, qo'lda joylanadi
const canPaste = !!(navigator.clipboard && navigator.clipboard.readText);
if (!canPaste) $('pasteBtn').hidden = true;
$('pasteBtn').addEventListener('click', async () => {
  try { $('code').value = await navigator.clipboard.readText(); render(); }
  catch (err) { $('codeMsg').className = 'msg warn'; $('codeMsg').textContent = "Buferni o'qib bo'lmadi — maydonni bosib turib, qo'lda joylang."; }
});

async function copyText(text) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; } } catch (err) { /* pastdagi usul */ }
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
  ta.remove();
  return ok;
}
$('copyBtn').addEventListener('click', async () => {
  const text = $('key').textContent.trim();
  const ok = await copyText(text);
  $('copyMsg').className = ok ? 'msg ok' : 'msg warn';
  $('copyMsg').textContent = ok ? 'Nusxalandi.' : "Nusxalab bo'lmadi — kalitni bosib turib, qo'lda nusxalang.";
});

// Sahifa 5 daqiqa ko'rinmay tursa o'zi qulflanadi (telefon birovning qo'lida qolsa)
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (secrets && hiddenAt && Date.now() - hiddenAt > 5 * 60 * 1000) lock();
});
</script>
</body>
</html>
