; Palantir telefon liniyasi — qo'ng'iroq yo'llari (install.sh /etc/asterisk ga ko'chiradi)

[general]
static=yes
writeprotect=yes

; PALANTIR_URL va PALANTIR_KEY (ovozli agent kaliti) — install.sh .env dan yozadi (git'ga tushmaydi)
#tryinclude extensions_palantir.conf

; AI'ga ulash: AudioSocket id'si = rejim (1 — egasi, 2 — mijoz, 3 — mijoz, administrator ko'tarmadi) + raqam uzunligi (2)
; + qo'ng'iroq qilgan raqam (13) + tasodifiy 16 raqam.
; Rejimni faqat shu fayl belgilaydi (qo'ng'iroq qaysi liniyadan kelgani): mijoz o'zini egasi qilib ko'rsata olmaydi.
; AI_SOCKET — faqat sinov kontekstlari qo'yadi (soxta AI); tashqaridan kelgan qo'ng'iroq uni o'zgartira olmaydi
[ai]
exten => s,1,Answer()
 same => n,Set(D=${FILTER(0123456789,${CALLERID(num)})})
 same => n,Set(D=${D:-13})
 same => n,Set(L=00${LEN(${D})})
 same => n,Set(NUM=0000000000000${D})
 same => n,Set(ID=${ARG1}${L:-2}${NUM:-13}${RAND(10000000,99999999)}${RAND(10000000,99999999)})
 ; Manzil IF() bilan emas: IF manzildagi «:» ni ajratgich deb oladi
 same => n,Set(SOCK=${AI_SOCKET})
 same => n,GotoIf($[${LEN(${SOCK})} > 0]?connect)
 same => n,Set(SOCK=127.0.0.1:9092)
 same => n(connect),AudioSocket(${ID:0:8}-${ID:8:4}-${ID:12:4}-${ID:16:4}-${ID:20:12},${SOCK})
 same => n,Hangup()

; AI administratorga o'tkazadi (sip_live.py, ish vaqtida, «AI javob beradi, kerak bo'lsa o'tkazadi» rejimi): qo'ng'iroq shu yerga
; buriladi (channel redirect), raqam — necha soniya jiringlashi. Administrator ko'tarmasa, band yoki ulanmagan bo'lsa — AI'ga qaytadi
; (3-rejim: uzr so'raydi va so'rov qoldiradi). Hech qaysi liniya bu yerga o'zi kirmaydi
[operator]
exten => _X!,1,Log(NOTICE,Palantir: ${CALLERID(num)} — AI administratorga o'tkazyapti)
 same => n,Dial(PJSIP/admin,${EXTEN})
 same => n,Log(NOTICE,Palantir: administrator — ${DIALSTATUS})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?end)
 same => n,Gosub(ai,s,1(3))
 same => n(end),Hangup()

; Egasining SIP ilovasidan: istalgan raqam — egasi rejimi; «2» — mijoz rejimini sinash (mijoz nima eshitadi)
[egasi]
exten => 2,1,Gosub(ai,s,1(2))
exten => _X!,1,Gosub(ai,s,1(1))

; Sinov (check_sip.py): «mijoz» savolini aytadi, suhbat /tmp/sinov.wav ga yoziladi. Hech qaysi liniya bu yerga kirmaydi
[sinov]
exten => s,1,Answer()
 same => n,MixMonitor(/tmp/sinov.wav)
 same => n,Wait(7)
 same => n,Playback(custom/savol)
 same => n,Wait(15)
 same => n,Hangup()

; Sinov: «mijoz» shu raqamdan qo'ng'iroq qilgandek (Local/<raqam>@sinov_raqam)
[sinov_raqam]
exten => _X.,1,Set(CALLERID(num)=${EXTEN})
 same => n,Goto(shahar,${EXTEN},1)

; Sinov (check_transfer.py): «mijoz» shu raqamdan qo'ng'iroq qilgandek, lekin AI o'rnida soxta AI (9096) — administratorga o'tkazish
; va qaytish yo'lini Gemini'siz tekshirish uchun (Local/<raqam>@sinov_otkazish)
[sinov_otkazish]
exten => _X.,1,Set(CALLERID(num)=${EXTEN})
 same => n,Set(AI_SOCKET=127.0.0.1:9096)
 same => n,Goto(shahar,${EXTEN},1)

; Shahar raqamiga kelgan qo'ng'iroq — kim javob berishini Palantir aytadi
[shahar]
exten => _X!,1,Goto(kiruvchi,s,1)
exten => s,1,Goto(kiruvchi,s,1)

; Palantir (Sozlamalar → Telefon liniyasi): «admin:20» — ish vaqti, avval administrator telefoni 20 soniya; ko'tarmasa, band yoki
; ulanmagan bo'lsa — AI. «ai» — darhol AI. Palantir javob bermasa ham — AI (mijoz javobsiz qolmasin). Ish vaqti o'zgarsa qayta yuklash shart emas
[kiruvchi]
exten => s,1,Set(CURLOPT(httpheader)=Authorization: Bearer ${PALANTIR_KEY})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(dnstimeout)=2)
 same => n,Set(ROUTE=${CURL(${PALANTIR_URL}/api/voice/route)})
 same => n,Log(NOTICE,Palantir: ${CALLERID(num)} — kim javob beradi: ${IF($["${ROUTE}" = ""]?javob yo'q, AI:${ROUTE})})
 same => n,GotoIf($["${CUT(ROUTE,:,1)}" = "admin"]?admin)
 same => n(ai),Gosub(ai,s,1(2))
 same => n,Hangup()
 same => n(admin),Dial(PJSIP/admin,${CUT(ROUTE,:,2)})
 same => n,Log(NOTICE,Palantir: administrator — ${DIALSTATUS})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?end)
 same => n,Goto(ai)
 same => n(end),Hangup()

; Administrator telefonidan: «2» — qabulxonani mijoz bo'lib sinash (boshqa raqamga chiqish yo'q)
[admin]
exten => 2,1,Gosub(ai,s,1(2))
