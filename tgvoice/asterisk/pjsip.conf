; Palantir telefon liniyasi — SIP ulanishlar (install.sh /etc/asterisk ga ko'chiradi)

[global]
type=global
user_agent=Palantir

[udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Ba'zi SIP ilovalar (Zoiper) o'zi TCP ni tanlaydi
[tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; ─── Egasining SIP ilovasi (telefonda Zoiper / Linphone): login «egasi», parol .env dagi SIP_OWNER_PASSWORD ───
; Faqat ichki tarmoqdan (Wi-Fi) ulanadi. Shu ilovadan qilingan qo'ng'iroq — egasi rejimi (vazifalar, Palantir)
[egasi]
type=endpoint
context=egasi
disallow=all
allow=alaw,ulaw
auth=egasi
aors=egasi
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
deny=0.0.0.0/0.0.0.0
permit=192.168.0.0/255.255.0.0
permit=10.0.0.0/255.0.0.0
permit=172.16.0.0/255.240.0.0
permit=127.0.0.0/255.0.0.0

[egasi]
type=aor
max_contacts=2
remove_existing=yes

; Parol — install.sh yaratadi (git'ga tushmaydi)
#include pjsip_egasi.conf

; ─── Administrator telefoni (qabulxonadagi telefonda Zoiper): login «admin», parolni panel yaratadi ───
; Ish vaqtida shahar raqamiga kelgan qo'ng'iroq avval shu telefonga jiringlaydi (Sozlamalar → Telefon liniyasi), ko'tarilmasa — AI
[admin]
type=endpoint
context=admin
disallow=all
allow=alaw,ulaw
auth=admin
aors=admin
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
deny=0.0.0.0/0.0.0.0
permit=192.168.0.0/255.255.0.0
permit=10.0.0.0/255.0.0.0
permit=172.16.0.0/255.240.0.0
permit=127.0.0.0/255.0.0.0

[admin]
type=aor
max_contacts=3
remove_existing=yes

; Parol — panel yozadi yoki install.sh tasodifiy qo'yadi (git'ga tushmaydi)
#include pjsip_admin.conf

; ─── Shahar raqami (Uztelecom): panel yozadi (Sozlamalar → Telefon liniyasi) yoki qo'lda — namuna: pjsip_shahar.conf.namuna ───
#tryinclude pjsip_shahar.conf
