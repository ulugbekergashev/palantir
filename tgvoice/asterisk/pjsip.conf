; Cerebro telefon liniyasi — SIP ulanishlar (install.sh /etc/asterisk ga ko'chiradi)

[global]
type=global
user_agent=Cerebro

[udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Ba'zi SIP ilovalar (Zoiper) o'zi TCP ni tanlaydi
[tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; ─── Egasining SIP ilovasi (telefonda Zoiper / Linphone): login «egasi», parol .env dagi SIP_OWNER_PASSWORD ───
; Faqat ichki tarmoqdan (Wi-Fi) ulanadi. Shu ilovadan qilingan qo'ng'iroq — egasi rejimi (vazifalar, Cerebro)
[egasi]
type=endpoint
context=egasi
disallow=all
allow=alaw,ulaw
auth=egasi
aors=egasi
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
deny=0.0.0.0/0.0.0.0
permit=192.168.0.0/255.255.0.0
permit=10.0.0.0/255.0.0.0
permit=172.16.0.0/255.240.0.0
permit=127.0.0.0/255.0.0.0

[egasi]
type=aor
max_contacts=2
remove_existing=yes

; Parol — install.sh yaratadi (git'ga tushmaydi)
#include pjsip_egasi.conf

; ─── Shahar raqami (Uztelecom): ma'lumotlari kelganda pjsip_shahar.conf yoziladi (namuna: pjsip_shahar.conf.namuna) ───
#tryinclude pjsip_shahar.conf
